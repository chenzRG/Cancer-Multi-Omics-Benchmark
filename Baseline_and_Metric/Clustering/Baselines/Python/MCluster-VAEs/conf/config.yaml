# Hydra settings
hydra:
  job:
    # Change working directory to the auto-generated run dir
    chdir: true
  run:
    # Local-relative output dir (overridable via hydra.run.dir=...)
    dir: ./outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

defaults:
  - dataset: pan
  - model: big
  - train: ${dataset}
  - _self_

# NOTE: do not put dataset.normalize / omic names here — they belong in
# conf/dataset/*.yaml. Values under _self_ would override dataset configs
# and break MLOmics keys (mRNA/CNV/Methy).

seed: 1
cv: null
test_size: 0.2  # If null and cv>1, defaults to 0.1

save_model: false
